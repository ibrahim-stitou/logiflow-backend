spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logiflow}
    username: ${DB_USER:logiflow}
    password: ${DB_PASSWORD:change-me-local-only}

  flyway:
    locations: classpath:db/migration,classpath:db/migration/seed

logiflow:
  security:
    permissive-local-profile: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.logiflow.tms: DEBUG
