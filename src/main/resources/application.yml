spring:
  application:
    name: logiflow-backend

  profiles:
    # Utilisé uniquement si aucun profil n'est explicitement activé (SPRING_PROFILES_ACTIVE ou
    # -Dspring-boot.run.profiles) : permet à `./mvnw spring-boot:run` de fonctionner tel quel
    # en développement local sans argument supplémentaire.
    default: local

  threads:
    virtual:
      enabled: true

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    # Jackson 3 sérialise nativement java.time sans horodatage numérique : plus besoin de
    # write-dates-as-timestamps (l'enum SerializationFeature ne le définit d'ailleurs plus).
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # spring.security.oauth2.resourceserver.jwt.* n'est PAS défini ici avec une valeur de repli
  # vide : un jwk-set-uri lié à une chaîne vide reste une propriété "présente" pour Spring Boot,
  # ce qui déclenche quand même la création (et l'échec immédiat) du JwtDecoder auto-configuré,
  # même quand SecurityConfig ne l'utilise pas. Les profils qui ont un vrai IdP (dev, prod) le
  # définissent eux-mêmes ; local/test tournent en mode permissif (logiflow.security.
  # permissive-local-profile) et n'en ont pas besoin.

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics,prometheus,modulith}
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logiflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    permissive-local-profile: false
    mfa:
      # Avec un IdP (Keycloak), exige que chaque jeton JWT prouve qu'une étape MFA a été réalisée :
      # les jetons dépourvus de preuve (claims OIDC `amr`/`acr`) sont rejetés en 401.
      # Voir docs/adr/0002-connexion-mfa-keycloak.md.
      required: ${MFA_REQUIRED:false}
      # Méthodes OIDC `amr` acceptées comme preuve MFA (Keycloak expose p. ex. "otp", "totp", "webauthn").
      amr-methods: ${MFA_AMR_METHODS:mfa,otp,totp,webauthn}
      # Valeurs `acr` acceptées comme preuve MFA supplémentaire (ex. "phr", "loa3"). Vide = contrôle `amr` seul.
      acr-values: ${MFA_ACR_VALUES:}
  storage:
    # Stockage disque local des documents (voir com.logiflow.tms.document.infrastructure.storage) ;
    # amené à être remplacé par un stockage objet (S3) via un nouvel adaptateur FileStorageService.
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
  ai-service:
    # Service interne (application Flask, dépôt séparé) : jamais exposé au frontend.
    # Voir docs/integration-ia.md.
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    # Valeur de repli non vide pour que l'application démarre même sans le service IA configuré
    # (profils local/test) : @NotBlank sur AiServiceProperties exigerait sinon une vraie clé.
    api-key: ${AI_SERVICE_API_KEY:local-dev-key}
    connect-timeout: ${AI_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:8s}

logging:
  pattern:
    correlation: "[%X{correlationId}]"
