spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    locations: classpath:db/migration,classpath:db/migration/seed

  security:
    oauth2:
      resourceserver:
        jwt:
          # Aucune valeur de repli : un IdP réel (Keycloak ou équivalent) est obligatoire dès que
          # ce profil est actif.
          issuer-uri: ${OAUTH2_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI}

logiflow:
  security:
    permissive-local-profile: false

logging:
  level:
    root: INFO
    com.logiflow.tms: INFO
