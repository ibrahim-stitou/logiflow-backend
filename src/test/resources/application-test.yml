# Datasource fournie dynamiquement par AbstractIntegrationTest (@DynamicPropertySource,
# conteneur Testcontainers PostgreSQL/PostGIS/pgvector).
spring:
  flyway:
    locations: classpath:db/migration

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

logiflow:
  cors:
    allowed-origins: http://localhost:4200
  security:
    # Les tests d'intégration authentifient via SecurityMockMvcRequestPostProcessors.jwt(), qui
    # injecte directement l'Authentication : aucun IdP réel n'est nécessaire ni disponible ici.
    permissive-local-profile: true

logging:
  level:
    root: WARN
    com.logiflow.tms: DEBUG
    org.testcontainers: INFO
