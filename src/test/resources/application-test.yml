# Datasource fournie dynamiquement par AbstractIntegrationTest (@DynamicPropertySource,
# conteneur Testcontainers PostgreSQL/PostGIS/pgvector).
spring:
  flyway:
    locations: classpath:db/migration

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

logiflow:
  osrm:
    # URL volontairement injoignable : les IT exercent le chemin 503 sans appel réseau externe.
    base-url: http://127.0.0.1:19999
  ai-service:
    # Service IA volontairement injoignable (même si Flask tourne en local sur 8000) : les IT
    # exercent le chemin de dégradation ; les tests d'agents simulent le port client.
    base-url: http://127.0.0.1:19998
  cors:
    allowed-origins: http://localhost:4200
  security:
    # Les tests d'intégration authentifient via SecurityMockMvcRequestPostProcessors.jwt(), qui
    # injecte directement l'Authentication : aucun IdP réel n'est nécessaire ni disponible ici.
    permissive-local-profile: true
  ai:
    maintenance:
      # Pas d'appel automatique au service IA pendant les tests d'intégration.
      analyse-nocturne: false
      reanalyse-sur-evenement: false

logging:
  level:
    root: WARN
    com.logiflow.tms: DEBUG
    org.testcontainers: INFO
