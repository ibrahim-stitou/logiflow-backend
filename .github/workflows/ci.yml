name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer le JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Rendre le wrapper Maven exécutable
        run: chmod +x mvnw

      - name: Vérifier le formatage (Spotless)
        run: ./mvnw -B spotless:check

      - name: Compiler
        run: ./mvnw -B -DskipTests compile

      # Inclut les tests unitaires, les tests d'architecture (ArchUnit) et la vérification de
      # modularité (Spring Modulith verify()) via surefire, puis les tests d'intégration
      # Testcontainers via failsafe. Le build échoue si l'une de ces étapes échoue.
      - name: Exécuter les tests (unitaires, architecture, intégration Testcontainers)
        run: ./mvnw -B verify

      - name: Publier le rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  docker-build:
    name: Construction de l'image Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker (sans publication)
        run: docker build -f docker/Dockerfile -t logiflow-backend:${{ github.sha }} .
