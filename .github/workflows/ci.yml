name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer le JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Rendre le wrapper Maven exécutable
        run: chmod +x mvnw

      - name: Vérifier le formatage (Spotless)
        run: ./mvnw -B spotless:check

      - name: Compiler
        run: ./mvnw -B -DskipTests compile

      # Inclut les tests unitaires, les tests d'architecture (ArchUnit) et la vérification de
      # modularité (Spring Modulith verify()) via surefire, puis les tests d'intégration
      # Testcontainers via failsafe. Le build échoue si l'une de ces étapes échoue.
      - name: Exécuter les tests (unitaires, architecture, intégration Testcontainers)
        run: ./mvnw -B verify

      - name: Publier le rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  docker-build:
    name: Construction (et publication sur main) des images Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publiée uniquement sur push vers main (jamais depuis une PR) : consommée par
      # logiflow-infra (ansible/roles/backend) pour déployer l'API sans avoir à builder sur la
      # cible.
      - name: Construire (et publier) l'image du backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logiflow-backend:latest
            ghcr.io/${{ github.repository_owner }}/logiflow-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image PostgreSQL custom (PostGIS + pgvector, voir docker/postgres/Dockerfile) : publiée
      # séparément car consommée telle quelle par logiflow-infra, indépendamment de l'API.
      - name: Construire (et publier) l'image PostgreSQL custom
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logiflow-postgres:latest
            ghcr.io/${{ github.repository_owner }}/logiflow-postgres:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image Keycloak de production (build optimisé PostgreSQL + thème LogiFlow, voir
      # docker/keycloak/Dockerfile) : consommée par logiflow-infra.
      - name: Construire (et publier) l'image Keycloak
        uses: docker/build-push-action@v6
        with:
          context: docker/keycloak
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logiflow-keycloak:latest
            ghcr.io/${{ github.repository_owner }}/logiflow-keycloak:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
