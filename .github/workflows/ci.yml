name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer le JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Rendre le wrapper Maven exécutable
        run: chmod +x mvnw

      - name: Vérifier le formatage (Spotless)
        run: ./mvnw -B spotless:check

      - name: Compiler
        run: ./mvnw -B -DskipTests compile

      # Inclut les tests unitaires, les tests d'architecture (ArchUnit) et la vérification de
      # modularité (Spring Modulith verify()) via surefire, puis les tests d'intégration
      # Testcontainers via failsafe. Le build échoue si l'une de ces étapes échoue.
      - name: Exécuter les tests (unitaires, architecture, intégration Testcontainers)
        run: ./mvnw -B verify

      - name: Publier le rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  docker-build:
    name: Construction, analyse (Trivy) et publication des images Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Builder BuildKit (docker-container) : cache GitHub Actions, chargement local pour
      # l'analyse, SBOM et provenance attachés aux images publiées.
      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Se connecter à GHCR
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chaque image est d'abord construite localement puis analysée par Trivy AVANT publication.
      # Image applicative : une CVE CRITIQUE corrigeable bloque la publication.
      # Images dérivées d'images tierces (PostgreSQL, Keycloak) : rapport non bloquant, car leurs
      # CVE dépendent des éditeurs amont (suivi hebdomadaire : workflow Sécurité).

      # --- Backend ---
      - name: Construire l'image du backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: logiflow-backend:analyse
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Analyser l'image du backend (bloquant sur CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: logiflow-backend:analyse
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Publiée uniquement sur push vers main (jamais depuis une PR) : consommée par
      # logiflow-infra. SBOM et provenance (SLSA) attachés à l'image.
      - name: Publier l'image du backend
        if: env.PUBLIER == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/logiflow-backend:latest
            ghcr.io/${{ github.repository_owner }}/logiflow-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend

      # --- PostgreSQL custom (PostGIS + pgvector, voir docker/postgres/Dockerfile) ---
      - name: Construire l'image PostgreSQL
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          load: true
          tags: logiflow-postgres:analyse
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Analyser l'image PostgreSQL (rapport)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: logiflow-postgres:analyse
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Publier l'image PostgreSQL
        if: env.PUBLIER == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/postgres
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/logiflow-postgres:latest
            ghcr.io/${{ github.repository_owner }}/logiflow-postgres:${{ github.sha }}
          cache-from: type=gha,scope=postgres

      # --- Keycloak de production (build optimisé + thème LogiFlow, voir docker/keycloak) ---
      - name: Construire l'image Keycloak
        uses: docker/build-push-action@v6
        with:
          context: docker/keycloak
          load: true
          tags: logiflow-keycloak:analyse
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      - name: Analyser l'image Keycloak (rapport)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: logiflow-keycloak:analyse
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Publier l'image Keycloak
        if: env.PUBLIER == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/keycloak
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/logiflow-keycloak:latest
            ghcr.io/${{ github.repository_owner }}/logiflow-keycloak:${{ github.sha }}
          cache-from: type=gha,scope=keycloak
