# Mises à jour de sécurité et de version automatiques (PR hebdomadaires groupées).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/docker, /docker/postgres, /docker/keycloak]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
