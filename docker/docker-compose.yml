name: logiflow

networks:
  logiflow-net:
    driver: bridge

volumes:
  logiflow-postgres-data:

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: logiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logiflow}
      POSTGRES_USER: ${POSTGRES_USER:-logiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      # 5433 par défaut : évite le conflit avec un PostgreSQL natif déjà présent sur 5432
      # (fréquent sur Windows/Laragon).
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ stocke les données dans un sous-répertoire versionné
      # (/var/lib/postgresql/18/docker) : il faut monter le parent, pas .../data.
      - logiflow-postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logiflow} -d ${POSTGRES_DB:-logiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logiflow-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logiflow-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@logiflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-local-only}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - logiflow-net

  # Service applicatif : décommenter pour exécuter le backend en conteneur.
  # app:
