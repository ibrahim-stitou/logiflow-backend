name: logiflow

networks:
  logiflow-net:
    driver: bridge

volumes:
  logiflow-postgres-data:

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: logiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logiflow}
      POSTGRES_USER: ${POSTGRES_USER:-logiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - logiflow-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logiflow} -d ${POSTGRES_DB:-logiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logiflow-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logiflow-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@logiflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-local-only}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - logiflow-net

  # Service applicatif : décommenter pour exécuter le backend en conteneur.
